version: 1

workspace:
  id: graph-inside-repo-workspace
  name: Graph Inside Repo Workspace

layout:
  root_path: ../..
  openlore_path: .openlore

engineering_kg:
  store_repository: requirements
  output_path: openspec/requirements_repo/.engineering-kg/ladybugdb

repositories:
  - id: requirements
    path: .
    description: OpenSpec store repository.
    ssh_url: git@bitbucket.example.internal:PAYMENTS/requirements.git
    default_branch: main
    role: requirements
    exploration:
      include_by_default: true
      search_exclusions:
        - .git
    git:
      dirty_worktree: read-with-warning
      fetch: forbidden
      pull: forbidden
      pull_requires_default_branch: true
