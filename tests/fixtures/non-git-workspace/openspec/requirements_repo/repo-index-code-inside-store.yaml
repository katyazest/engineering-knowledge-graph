version: 1

workspace:
  id: code-inside-store-workspace
  name: Code Inside Store Workspace

layout:
  root_path: ../..
  openlore_path: .openlore

engineering_kg:
  store_repository: requirements
  output_path: .engineering-kg/ladybugdb

repositories:
  - id: requirements
    path: .
    description: OpenSpec store repository.
    ssh_url: git@bitbucket.example.internal:PAYMENTS/requirements.git
    default_branch: main
    role: requirements
    exploration:
      include_by_default: true
      search_exclusions:
        - .git
    git:
      dirty_worktree: read-with-warning
      fetch: forbidden
      pull: forbidden
      pull_requires_default_branch: true

  - id: payment-service
    path: ./src/codebase_repos/payment-service
    description: Backend service incorrectly nested inside the OpenSpec store.
    ssh_url: git@bitbucket.example.internal:APPLICATIONS/payment-service.git
    default_branch: main
    role: code
    service:
      id: payment-service
      name: Payment Service
    exploration:
      include_by_default: true
      search_exclusions:
        - .git
    git:
      dirty_worktree: read-with-warning
      fetch: allowed
      pull: allowed
      pull_requires_default_branch: true
